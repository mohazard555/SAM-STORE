    <script>
      /**
       * App Compatibility Layer
       * Detects environment and provides safe fallbacks for Print, Download, and Navigation.
       */
      window.AppCompatibility = {
        getEnvironment: function() {
          const ua = navigator.userAgent.toLowerCase();
          if (window.__TAURI__) return 'tauri';
          if (ua.includes('appcreator24')) return 'appcreator24';
          if (ua.includes('wv') || ua.includes('webview') || (ua.includes('android') && ua.includes('version/'))) return 'android-webview';
          return 'browser';
        },
        
        isMobile: function() {
          return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase());
        },

        safePrint: function(htmlContent) {
          const env = this.getEnvironment();
          console.log('Printing in environment:', env);
          
          // Get the actual HTML content to print
          const printSection = document.getElementById('print-section');
          const content = htmlContent || (printSection ? printSection.innerHTML : '');

          if (env === 'android-webview' || env === 'appcreator24') {
            // WebViews often struggle with window.print()
            // We'll prepare a job and open it in a new tab (which usually triggers the external browser)
            this._prepareAndOpenJob({
              html: content,
              filename: 'تقرير_طباعة.html',
              action: 'print'
            });
          } else {
            window.print();
          }
        },

        safeDownload: function(urlOrData, filename, mimeType) {
          const env = this.getEnvironment();
          console.log('Downloading in environment:', env, filename);

          if (env === 'android-webview' || env === 'appcreator24') {
            if (urlOrData.startsWith('data:') || urlOrData.startsWith('blob:')) {
              if (urlOrData.startsWith('data:')) {
                const base64 = urlOrData.split('base64,')[1];
                this._prepareAndOpenJob({
                  base64: base64,
                  filename: filename,
                  mimeType: mimeType,
                  action: 'download'
                });
                return;
              }
              // Fallback for blob URLs
              window.open(urlOrData, '_blank');
            } else {
              window.open(urlOrData, '_blank');
            }
          } else {
            const link = document.createElement('a');
            link.href = urlOrData;
            link.download = filename || 'download';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }
        },

        _prepareAndOpenJob: function(jobData) {
          const self = this;
          fetch('/api/prepare-job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(jobData)
          })
          .then(response => response.json())
          .then(data => {
            if (data.id) {
              const url = '/api/view-job/' + data.id + '?action=' + jobData.action;
              // Opening in _blank often triggers the system browser in WebViews
              const newWin = window.open(url, '_blank');
              if (!newWin || newWin.closed || typeof newWin.closed == 'undefined') {
                // Pop-up blocked, try direct location change as fallback
                alert('يرجى السماح بفتح النوافذ المنبثقة لعرض الملف أو الطباعة.');
                window.location.href = url;
              }
            }
          })
          .catch(err => {
            console.error('Job preparation error:', err);
            alert('عذراً، حدث خطأ أثناء تجهيز الملف.');
          });
        }
      };

      // Global error handling to prevent JS crashes in older WebViews
      window.onerror = function(msg, url, line, col, error) {
        console.error('Global Error:', msg, 'at', url, ':', line);
        return false; // Let it propagate to console
      };
    </script>
